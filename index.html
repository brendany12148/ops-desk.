<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ops Desk</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#17170f; --paper:#eeead9; --paper-dim:#e2ded0;
    --teal:#2f5d50; --teal-dim:#c7d8d0; --amber:#c07f24;
    --line:#c9c3ac; --muted:#7a7663; --card:#f7f5ea; --danger:#a3402f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; min-height:100vh;}

  .app{ display:flex; min-height:100vh; }

  /* left rail */
  .rail{
    width:190px; flex-shrink:0;
    border-right:2px solid var(--ink);
    padding:24px 0;
    display:flex; flex-direction:column;
  }
  .rail .brand{
    font-family:'Newsreader', serif; font-weight:600; font-size:20px;
    padding:0 20px 20px; border-bottom:1px solid var(--line); margin-bottom:10px;
  }
  .rail .nav-item{
    font-family:'IBM Plex Mono', monospace; font-size:12px;
    padding:11px 20px; cursor:pointer; color:var(--muted);
    display:flex; gap:10px; align-items:baseline;
    border-left:3px solid transparent;
  }
  .rail .nav-item .no{ color:var(--muted); }
  .rail .nav-item:hover{ background:var(--paper-dim); color:var(--ink); }
  .rail .nav-item.active{ background:var(--card); color:var(--ink); border-left-color:var(--teal); font-weight:600; }
  .rail .nav-item.active .no{ color:var(--teal); }

  .main{ flex:1; padding:28px 32px 80px; max-width:1080px; }

  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:24px; flex-wrap:wrap; gap:10px;
  }
  .section-head h1{ font-family:'Newsreader', serif; font-weight:600; font-size:26px; margin:0; }
  .section-head .sub{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); letter-spacing:.06em; }

  .panel{ background:var(--card); border:1px solid var(--line); margin-bottom:18px; }
  .empty-state{ padding:50px 24px; text-align:center; color:var(--muted); }
  .empty-state .glyph{ font-family:'Newsreader', serif; font-size:36px; color:var(--teal); margin-bottom:8px; }
  .empty-state button{ margin-top:14px; }

  .profile-head{ display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); }
  .profile-head h2{ font-family:'Newsreader', serif; font-size:20px; font-weight:600; margin:0; }
  .profile-head .sub{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }

  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:760px){ .grid-2{ grid-template-columns:1fr; } }

  .field{ padding:14px 20px; }
  .field label{ display:block; font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--teal); margin-bottom:6px; }
  .field .hint{ font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.4; }
  input[type=text], input[type=date], input[type=password], textarea, select{
    width:100%; font-family:'IBM Plex Sans', sans-serif; font-size:13.5px; padding:8px 10px;
    border:1px solid var(--line); background:#fff; color:var(--ink); resize:vertical;
  }
  input:focus, textarea:focus, select:focus{ outline:2px solid var(--teal); outline-offset:-1px; }
  textarea{ min-height:60px; line-height:1.45; }

  .platform-check{ display:flex; flex-wrap:wrap; gap:8px; }
  .platform-check label{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink);
    border:1px solid var(--line); padding:6px 10px; cursor:pointer; background:#fff;
  }
  .platform-check input{ accent-color:var(--teal); }
  .platform-check label.checked{ background:var(--teal-dim); border-color:var(--teal); }

  button{
    font-family:'IBM Plex Sans', sans-serif; font-size:13px; font-weight:600;
    padding:9px 16px; border:1px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer;
  }
  button:hover{ background:#000; }
  button.ghost{ background:transparent; color:var(--ink); }
  button.ghost:hover{ background:var(--paper-dim); }
  button.danger{ border-color:var(--danger); color:var(--danger); background:transparent; }
  button.danger:hover{ background:var(--danger); color:#fff; }
  button.small{ font-size:11.5px; padding:6px 10px; }
  button:disabled{ opacity:.5; cursor:not-allowed; }

  .btn-row{ display:flex; gap:10px; padding:14px 20px 20px; flex-wrap:wrap; }

  .client-pills{ display:flex; gap:2px; flex-wrap:wrap; margin-bottom:16px; }
  .client-pill{
    font-family:'IBM Plex Mono', monospace; font-size:12px; padding:8px 14px;
    background:var(--paper-dim); border:1px solid var(--line); color:var(--muted); cursor:pointer; white-space:nowrap;
  }
  .client-pill:hover{ background:var(--teal-dim); color:var(--ink); }
  .client-pill.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .status-line{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--muted); padding:0 20px 14px; }
  .status-line.err{ color:var(--danger); }
  .loading-row{ padding:26px 20px; text-align:center; color:var(--muted); font-family:'IBM Plex Mono', monospace; font-size:12px; }

  /* content posts */
  .posts{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:14px; padding:4px 0 0; }
  .post-card{ background:var(--card); border:1px solid var(--line); border-top:3px solid var(--teal); padding:14px; }
  .post-card .meta{ display:flex; justify-content:space-between; margin-bottom:8px; }
  .post-card .platform{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--teal); font-weight:600; }
  .post-card .idx{ font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--muted); }
  .post-card .uses{ font-size:12px; color:var(--muted); margin-bottom:8px; font-style:italic; }
  .post-card .caption{ font-size:13.5px; line-height:1.5; white-space:pre-wrap; margin-bottom:8px; }
  .post-card .tags{ font-size:12px; color:var(--teal); margin-bottom:10px; word-break:break-word; }
  .copied-flag{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--teal); }

  /* calls */
  .call-entry{ border:1px solid var(--line); background:var(--card); margin-bottom:12px; padding:14px 16px; }
  .call-entry .call-date{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--muted); margin-bottom:8px; }
  .call-entry h4{ font-family:'Newsreader', serif; font-size:14.5px; margin:10px 0 4px; font-weight:600; color:var(--teal); }
  .call-entry ul{ margin:4px 0 0; padding-left:18px; font-size:13px; line-height:1.5; }
  .call-entry .recap-box{ background:#fff; border:1px solid var(--line); padding:10px; font-size:13px; white-space:pre-wrap; margin-top:4px; }

  /* casting table */
  table.roster{ width:100%; border-collapse:collapse; font-size:13px; }
  table.roster th{ text-align:left; font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--teal); border-bottom:1px solid var(--line); padding:8px 10px; }
  table.roster td{ padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.roster tr:last-child td{ border-bottom:none; }
  .roster-actions{ display:flex; gap:6px; }

  .shortlist-card{ border:1px solid var(--line); border-left:3px solid var(--amber); background:var(--card); padding:12px 14px; margin-bottom:10px; }
  .shortlist-card .name{ font-family:'Newsreader', serif; font-weight:600; font-size:15px; }
  .shortlist-card .fit{ font-size:13px; line-height:1.5; margin-top:4px; }

  /* tasks */
  .task-row{ display:flex; align-items:center; gap:10px; padding:9px 16px; border-bottom:1px solid var(--line); }
  .task-row:last-child{ border-bottom:none; }
  .task-row input[type=checkbox]{ accent-color:var(--teal); width:16px; height:16px; flex-shrink:0; }
  .task-row .task-text{ flex:1; font-size:13.5px; }
  .task-row.done .task-text{ text-decoration:line-through; color:var(--muted); }
  .task-row .task-meta{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--muted); white-space:nowrap; }
  .task-filters{ display:flex; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); }
  .task-filters button{ font-size:11.5px; padding:5px 10px; }
  .task-filters button.ghost.active{ background:var(--teal-dim); }

  /* graphics */
  .graphics-note{ font-size:12.5px; color:var(--muted); line-height:1.5; padding:14px 20px; border-top:1px solid var(--line); background:var(--paper-dim); }
  .result-img{ max-width:100%; border:1px solid var(--line); margin-top:10px; }

  /* home */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-bottom:20px; }
  .stat-box{ background:var(--card); border:1px solid var(--line); border-top:3px solid var(--teal); padding:16px; }
  .stat-box .num{ font-family:'Newsreader', serif; font-size:30px; font-weight:600; }
  .stat-box .lbl{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-top:4px; }

  .delete-row{ padding:10px 20px 18px; border-top:1px solid var(--line); }

  /* motion & delight */
  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  .panel{ animation: fadeInUp .28s ease; }
  button{ transition: transform .12s ease, background .15s ease, box-shadow .15s ease; }
  button:hover{ transform: translateY(-1px); }
  button:active{ transform: scale(0.96) translateY(0); }
  .client-tab, .client-pill, .sub-tab{ transition: background .15s ease, color .15s ease, transform .12s ease; }
  .client-tab:active, .client-pill:active, .sub-tab:active{ transform: scale(0.97); }
  .rail .nav-item{ transition: background .15s ease, border-color .2s ease, transform .12s ease; }
  .rail .nav-item:active{ transform: scale(0.98); }
  @keyframes checkPop{ 0%{ transform:scale(1); } 35%{ transform:scale(1.035); } 100%{ transform:scale(1); } }
  .task-row.just-checked{ animation: checkPop .3s ease; }
  input[type=checkbox]{ transition: transform .12s ease; cursor:pointer; }
  input[type=checkbox]:active{ transform: scale(1.15); }
  .candidate-card, .post-card, .production-card, .shortlist-card, .stat-box{ transition: transform .15s ease, box-shadow .15s ease; }
  .candidate-card:hover{ transform: translateY(-2px); box-shadow: 0 4px 14px rgba(23,23,15,0.08); }
  .stat-box{ animation: fadeInUp .32s ease; }

  @keyframes confettiFall{
    0%{ transform: translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; }
  }
  .confetti-piece{
    position:fixed; top:0; left:0; width:8px; height:8px; pointer-events:none; z-index:2000;
    animation: confettiFall var(--dur) ease-out forwards;
  }

  /* calendar */
  .cal-day-group{ margin-bottom:14px; }
  .cal-day-label{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--teal); padding:10px 20px 4px; }
  .cal-event{ display:flex; gap:12px; padding:10px 20px; border-bottom:1px solid var(--line); align-items:flex-start; }
  .cal-event:last-child{ border-bottom:none; }
  .cal-event .time{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--muted); width:70px; flex-shrink:0; padding-top:1px; }
  .cal-event .body{ flex:1; }
  .cal-event .title{ font-size:13.5px; font-weight:600; }
  .cal-event .meta2{ font-size:12px; color:var(--muted); margin-top:2px; }
  .cal-event .badge{ display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; background:var(--teal-dim); color:var(--teal); padding:2px 6px; margin-right:6px; }
  .sub-tabs{ display:flex; gap:2px; margin-bottom:16px; }
  .sub-tab{ font-family:'IBM Plex Mono', monospace; font-size:12px; padding:8px 14px; background:var(--paper-dim); border:1px solid var(--line); color:var(--muted); cursor:pointer; }
  .sub-tab:hover{ background:var(--teal-dim); color:var(--ink); }
  .sub-tab.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  /* mini calendar */
  .cal-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; }
  .cal-header h2{ font-family:'Newsreader', serif; font-size:19px; font-weight:600; margin:0; }
  .cal-nav-btns{ display:flex; gap:6px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); border-top:1px solid var(--line); border-left:1px solid var(--line); }
  .cal-dow{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); text-align:center; padding:6px 0; border-right:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--paper-dim); }
  .cal-cell{ min-height:64px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px; cursor:pointer; position:relative; background:var(--card); }
  .cal-cell:hover{ background:var(--teal-dim); }
  .cal-cell.out-month{ background:var(--paper-dim); color:var(--muted); }
  .cal-cell.is-today .daynum{ background:var(--ink); color:var(--paper); border-radius:50%; width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center; }
  .cal-cell.is-selected{ outline:2px solid var(--teal); outline-offset:-2px; }
  .cal-cell .daynum{ font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .cal-cell .dots{ position:absolute; bottom:6px; left:6px; display:flex; gap:3px; }
  .cal-dot{ width:6px; height:6px; border-radius:50%; }
  .cal-dot.event{ background:var(--teal); }
  .cal-dot.shoot{ background:var(--amber); }
  .cal-dot.payment{ background:var(--danger); }
  .day-events{ padding:6px 20px 16px; }
  .day-event-row{ padding:10px 0; border-bottom:1px solid var(--line); }
  .day-event-row:last-child{ border-bottom:none; }
  .day-event-row .de-title{ font-size:13.5px; font-weight:600; }
  .day-event-row .de-meta{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--muted); margin-top:2px; }
  .day-event-row .de-notes{ font-size:12.5px; color:var(--ink); margin-top:4px; }
  .type-tag{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; padding:2px 6px; margin-right:6px; }
  .type-tag.call{ background:var(--teal-dim); color:var(--teal); }
  .type-tag.shoot{ background:#f2e6c9; color:var(--amber); }
  .type-tag.general{ background:var(--paper-dim); color:var(--muted); }

  /* productions */
  .production-card{ background:var(--card); border:1px solid var(--line); border-left:3px solid var(--teal); padding:14px 16px; margin-bottom:12px; cursor:pointer; }
  .production-card .p-name{ font-family:'Newsreader', serif; font-weight:600; font-size:16px; }
  .production-card .p-meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); margin-top:4px; }
  .production-card .p-cast{ font-size:12.5px; color:var(--ink); margin-top:6px; }
  .cast-row{ display:flex; align-items:center; gap:10px; padding:8px 16px; border-bottom:1px solid var(--line); }
  .cast-row:last-child{ border-bottom:none; }
  .cast-row .cname{ flex:1; font-size:13.5px; }
  .status-pill{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; padding:3px 8px; border:1px solid var(--line); }
  .status-pill.confirmed{ background:var(--teal-dim); border-color:var(--teal); color:var(--teal); }
  .status-pill.tentative{ background:#f2e6c9; border-color:var(--amber); color:var(--amber); }
  .status-pill.declined{ background:#f0d9d3; border-color:var(--danger); color:var(--danger); }

  .cat-badge{ display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; background:var(--paper-dim); border:1px solid var(--line); color:var(--muted); padding:2px 7px; margin-right:6px; }
  .candidate-card{ background:var(--card); border:1px solid var(--line); cursor:pointer; overflow:hidden; }
  .candidate-card img{ width:100%; height:150px; object-fit:cover; display:block; border-bottom:1px solid var(--line); }
  .candidate-card .no-photo{ width:100%; height:150px; display:flex; align-items:center; justify-content:center; background:var(--paper-dim); color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:11px; border-bottom:1px solid var(--line); }
  .candidate-card .cbody{ padding:10px 12px; }
  .candidate-card .cname{ font-family:'Newsreader', serif; font-weight:600; font-size:14.5px; }

  .modal-overlay{ position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(23,23,15,0.55); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .modal-box{ background:var(--card); border:1px solid var(--ink); max-width:420px; width:100%; max-height:88vh; overflow-y:auto; }
  .modal-box img{ width:100%; max-height:320px; object-fit:cover; display:block; }
  .modal-box .mbody{ padding:18px 20px; }
  .modal-close{ position:absolute; top:10px; right:10px; background:var(--ink); color:var(--paper); border:none; width:28px; height:28px; cursor:pointer; font-size:15px; line-height:1; }
  .modal-box-wrap{ position:relative; }
  input[type=file]{ font-family:'IBM Plex Sans', sans-serif; font-size:12.5px; }

  /* general operations */
  .staff-name-input{ font-family:'Newsreader', serif; font-weight:600; font-size:19px; border:none; background:transparent; padding:2px 0; width:auto; flex:1; }
  .staff-name-input:focus{ outline:none; border-bottom:1px solid var(--teal); }
  .bullet-row{ display:flex; align-items:flex-start; gap:8px; padding:8px 20px; border-bottom:1px solid var(--line); }
  .bullet-row:last-child{ border-bottom:none; }
  .bullet-row .bullet-dot{ color:var(--teal); font-size:14px; line-height:1.5; flex-shrink:0; }
  .bullet-row .bullet-text{ flex:1; font-size:13.5px; line-height:1.5; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="app">
  <div class="rail">
    <div class="brand">Ops Desk</div>
    <div id="navItems"></div>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
const PLATFORMS = ["Instagram","TikTok","Facebook","X","LinkedIn"];
const SECTIONS = [
  {id:'home', label:'Home'},
  {id:'calendar', label:'Calendar'},
  {id:'content', label:'Content'},
  {id:'graphics', label:'Graphics'},
  {id:'clients', label:'Clients'},
  {id:'calls', label:'Client Calls'},
  {id:'casting', label:'Casting'},
  {id:'generalops', label:'General Operations'},
];
const RELEVANT_KEYWORDS = /shoot|cast|casting|pre-?production|pre-?pro|production|call\b/i;
const HIGGSFIELD_SOFTWARE = [
  { value:'soul2', label:'Soul 2.0', group:'Image',
    guidance:"Higgsfield's native fashion/editorial image model. Prompt like an art director: subject, wardrobe, pose, lighting setup, and mood in concrete visual terms.",
    technical:'Strong with Soul ID for locking a consistent character/model face across multiple generations — mention if this shot should match a previously established character.' },
  { value:'soulcinema', label:'Soul Cinema', group:'Image',
    guidance:'Cinematic-grade stills variant of Soul. Prompt like directing a film still, not a snapshot: lens feel, color grade, framing, and atmosphere in addition to the subject.',
    technical:'Favors specific film-language terms (e.g. "35mm anamorphic," "teal-and-orange grade") over generic mood words.' },
  { value:'nanobananapro', label:'Nano Banana Pro', group:'Image',
    guidance:"Google's reasoning-heavy image model (Gemini 3 Pro Image) — it reasons through spatial relationships and lighting physics before rendering. Best for complex multi-object scenes, layered compositions, and any image that needs legible text rendered in it.",
    technical:'Write full creative-director sentences, not keyword lists. Supports up to ~14 reference images for brand consistency and up to 4K/14 aspect ratios — mention exact lighting setup (e.g. "three-point softbox") and camera hardware explicitly. Slower (10-20s) and pricier than Nano Banana 2 — reach for it when the scene is genuinely complex or has in-image text.' },
  { value:'nanobanana2', label:'Nano Banana 2', group:'Image',
    guidance:"Google's fast default image model (Gemini 3.1 Flash Image), 2-3x quicker than Pro with nearly the same quality on typical prompts.",
    technical:'Same creative-director prompting style as Pro works, but keep scenes simpler — it reasons less deeply about complex multi-element layouts. Best for rapid iteration and bulk variations rather than one perfect complex composition.' },
  { value:'seedream', label:'Seedream', group:'Image',
    guidance:'General-purpose photoreal image model. A straightforward descriptive prompt works well: subject, setting, lighting, style.' },
  { value:'gptimage', label:'GPT Image', group:'Image',
    guidance:"OpenAI's general-purpose image model. Clear, structured prompt describing scene, style, and composition.",
    technical:'Particularly strong at rendering short text accurately inside an image.' },
  { value:'dop', label:'Higgsfield DOP', group:'Video',
    guidance:'Image-to-video model — needs a starting keyframe image. Describe the camera move/action (push-in, orbit, handheld, etc.), not just the static scene.' },
  { value:'popcorn', label:'Popcorn', group:'Video',
    guidance:'Storyboard-driven video pipeline. Describe a short sequence of shots/beats rather than one static scene.' },
  { value:'cinemastudio', label:'Cinema Studio', group:'Video',
    guidance:'Professional virtual-camera video. Include lens type, focal length, camera movement, and grading language for a filmic result.' },

/* Hosted edition: uses this browser's localStorage instead of Claude's
   artifact storage, so data persists independent of any Claude conversation. */
const STORAGE_PREFIX = 'opsdesk:';
async function storageGet(key){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ console.error('load fail', key, e); return null; }
}
async function storageSet(key,val){
  try{ localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(val)); }
  catch(e){ console.error('save fail', key, e); alert('Could not save — your browser storage may be full or blocked.'); }
}

function todayKeyStr(){ return new Date().toISOString().slice(0,10); }

function spawnConfetti(anchorEl, size){
  size = size || 'small';
  const rect = anchorEl.getBoundingClientRect();
  const originX = rect.left + rect.width/2;
  const originY = rect.top + rect.height/2;
  const colors = ['#17170f','#2f5d50','#c07f24','#eeead9','#7a7663'];
  const count = size==='big' ? 50 : 10;
  const spreadBase = size==='big' ? 110 : 30;
  const spreadRange = size==='big' ? 140 : 25;
  const durBase = size==='big' ? 0.9 : 0.5;
  const durRange = size==='big' ? 0.6 : 0.3;
  for(let i=0; i<count; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const angle = Math.random() * Math.PI * 2;
    const distance = spreadBase + Math.random() * spreadRange;
    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance - (size==='big' ? 50 : 25);
    const rot = (Math.random() * 720 - 360) + 'deg';
    const dur = (durBase + Math.random()*durRange) + 's';
    piece.style.left = originX + 'px';
    piece.style.top = originY + 'px';
    if(size==='big'){ piece.style.width='10px'; piece.style.height='10px'; }
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.setProperty('--dx', dx + 'px');
    piece.style.setProperty('--dy', dy + 'px');
    piece.style.setProperty('--rot', rot);
    piece.style.setProperty('--dur', dur);
    document.body.appendChild(piece);
    setTimeout(()=> piece.remove(), 1500);
  }
}
function addBusinessDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  let added = 0;
  while(added < n){
    d.setDate(d.getDate()+1);
    const day = d.getDay();
    if(day !== 0 && day !== 6) added++;
  }
  return d.toISOString().slice(0,10);
}
function getPaymentReminders(){
  return state.productions
    .filter(p => p.date && !p.paymentPaid)
    .map(p => ({ production: p, dueDate: addBusinessDays(p.date, 7) }))
    .sort((a,b) => a.dueDate < b.dueDate ? -1 : 1);
}

function renderDailyChecklist(container){
  if(!state.dailyResponsibilities.length){
    container.innerHTML = `<div class="loading-row" style="font-style:italic;">No recurring responsibilities set up yet — click "Manage list" to add some.</div>`;
    return;
  }
  container.innerHTML = '';
  state.dailyResponsibilities.forEach(r=>{
    const done = state.todayCompletions.includes(r.id);
    const row = document.createElement('div'); row.className='task-row'+(done?' done':'');
    row.innerHTML = `<input type="checkbox" ${done?'checked':''}><span class="task-text">${esc(r.text)}</span>`;
    row.querySelector('input').onchange = (e)=>{
      if(e.target.checked) state.todayCompletions.push(r.id);
      else state.todayCompletions = state.todayCompletions.filter(id=>id!==r.id);
      storageSet('completions:'+state.todayKey, state.todayCompletions);
      row.classList.add('just-checked');
      const nowComplete = state.dailyResponsibilities.length > 0 && state.todayCompletions.length === state.dailyResponsibilities.length;
      if(e.target.checked){ spawnConfetti(row, nowComplete ? 'big' : 'small'); }
      setTimeout(render, nowComplete ? 260 : 160);
    };
    container.appendChild(row);
  });

async function generatePosts(client, raw, count){
  state.loading = true; setStatus('statusLine','');
  renderPosts(document.getElementById('postsWrap'), client.id);
  const systemPrompt = `You are a social media content strategist generating CONCEPTS for a client to react to — not finished, ready-to-post captions. Respond ONLY with valid JSON, no preamble, no markdown fences. The JSON must be an array of concept objects with exactly these fields: "format" (e.g. Photo, Reel, Carousel, Story), "title" (a short punchy hook/name for the idea), "concept" (2-3 sentences describing the idea, angle, or story), "captionDirection" (one short line on the tone/angle a caption for this could take — not a full caption).`;
  const userPrompt = `CLIENT: ${client.name}\\nPLATFORMS: ${client.platforms.join(', ')||'Instagram'}\\nVOICE: ${client.voice||'not specified'}\\nTONE: ${client.tone||'not specified'}\\nPILLARS: ${client.pillars||'not specified'}\\nAVOID/COMPLIANCE (follow strictly): ${client.avoid||'none'}\\n\\n${raw ? 'RAW CONTENT AVAILABLE:\\n'+raw : 'No specific raw content provided — generate fresh ideas based on the pillars and voice above.'}\\n\\nGenerate ${count} distinct content concepts. Return ONLY the JSON array.`;
  try{
    const res = await callClaude(systemPrompt, userPrompt, 2000);
    const parsed = parseJsonFromClaude(res);
    state.posts[client.id] = parsed;
    await storageSet('posts:'+client.id, parsed);
    setStatus('statusLine', `Generated ${parsed.length} concepts.`);
  }catch(e){ console.error(e); setStatus('statusLine','Something went wrong. Try again.', true); }

}

function fileToCompressedDataUrl(file, maxDim, quality){
  maxDim = maxDim || 700; quality = quality || 0.78;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else{ if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function generateShortlist(prod, wrap){
  state.loading = true;
  wrap.innerHTML = `<div class="panel loading-row">Reviewing the candidate pool against the brief…</div>`;
  const poolText = prod.cast.map(c=>`- ${c.name} | category: ${c.category||'unspecified'} | status: ${c.status} | details: ${c.details}`).join('\\n');
  const systemPrompt = `You are a casting assistant. Respond ONLY with valid JSON, no markdown fences. JSON array of entries, each with "name" (must match a candidate name exactly), "fit" (2-3 sentences on how well they fit the brief and any concerns), ordered best fit first. Include every candidate provided, even weak fits — just note the concern.`;
  const userPrompt = `SHOOT BRIEF:\\n${prod.brief}\\n\\nCANDIDATE POOL:\\n${poolText}\\n\\nReturn ONLY the JSON array.`;
  try{
    const res = await callClaude(systemPrompt, userPrompt, 1500);
    const parsed = parseJsonFromClaude(res);
    state.loading = false;
    wrap.innerHTML = '';
    parsed.forEach((p,i)=>{
      const card = document.createElement('div'); card.className='shortlist-card';
      card.innerHTML = `<div class="name">${String(i+1).padStart(2,'0')} — ${esc(p.name)}</div><div class="fit">${esc(p.fit)}</div>`;
      wrap.appendChild(card);
    });
    setStatus('shortlistStatus', `Ranked ${parsed.length} candidate(s).`);
  }catch(e){
    console.error(e); state.loading=false;
    wrap.innerHTML = `<div class="panel loading-row" style="font-style:italic;">Something went wrong. Try again.</div>`;
    setStatus('shortlistStatus','Something went wrong.', true);
  }
}

/* ---------- CALENDAR (self-contained mini calendar) ---------- */
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function getMonthMatrix(year, month){
  const firstOfMonth = new Date(year, month, 1);
  const startDow = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=startDow-1; i>=0; i--){
    const d = daysInPrevMonth - i;
    const m = month===0 ? 11 : month-1;
    const y = month===0 ? year-1 : year;
    cells.push({ dateStr: dateKey(y,m,d), dayNum:d, inMonth:false });
  }
  for(let d=1; d<=daysInMonth; d++){
    cells.push({ dateStr: dateKey(year,month,d), dayNum:d, inMonth:true });
  }
  while(cells.length % 7 !== 0 || cells.length < 42){
    const idx = cells.length - (startDow + daysInMonth);
    const d = idx + 1;
    const m = month===11 ? 0 : month+1;
    const y = month===11 ? year+1 : year;
    cells.push({ dateStr: dateKey(y,m,d), dayNum:d, inMonth:false });
    if(cells.length >= 42) break;
  }
  const weeks = [];
  for(let i=0; i<cells.length; i+=7) weeks.push(cells.slice(i,i+7));
  return weeks;
}
function dateKey(y,m,d){
  const mm = String(m+1).padStart(2,'0');
  const dd = String(d).padStart(2,'0');
  return `${y}-${mm}-${dd}`;
}

function getItemsForDate(dateStr){
  const items = [];
  state.myEvents.filter(e=>e.date===dateStr).forEach(e=>{
    items.push({ kind:'event', type:e.type||'general', title:e.title, time:e.time, notes:e.notes, id:e.id });
  });
  state.productions.filter(p=>p.date===dateStr).forEach(p=>{
    items.push({ kind:'shoot', type:'shoot', title:'Shoot: '+p.name, notes:p.client||'' });
    if(!p.paymentPaid){
      const due = addBusinessDays(p.date, 7);
      if(due===dateStr) items.push({ kind:'payment', type:'payment', title:'Payment due: '+p.name, notes:'' });
    }
  });
  return items;
}

function renderCalendar(main){
  main.innerHTML = `<div class="section-head"><h1>Calendar</h1><span class="sub">YOUR OWN SCHEDULE — LOGGED HERE</span></div>`;

  const calPanel = document.createElement('div'); calPanel.className='panel';
  calPanel.innerHTML = `
    <div class="cal-header">
      <h2>${MONTH_NAMES[state.calendarViewMonth]} ${state.calendarViewYear}</h2>
      <div class="cal-nav-btns">
        <button class="ghost small" id="calPrevBtn">‹ Prev</button>
        <button class="ghost small" id="calTodayBtn">Today</button>
        <button class="ghost small" id="calNextBtn">Next ›</button>
      </div>
    </div>
  `;
  const grid = document.createElement('div'); grid.className='cal-grid';
  DOW.forEach(d=>{ const el2=document.createElement('div'); el2.className='cal-dow'; el2.textContent=d; grid.appendChild(el2); });
  const weeks = getMonthMatrix(state.calendarViewYear, state.calendarViewMonth);
  const today = todayKeyStr();
  weeks.flat().forEach(cell=>{
    const items = getItemsForDate(cell.dateStr);
    const c = document.createElement('div');
    c.className = 'cal-cell' + (cell.inMonth?'':' out-month') + (cell.dateStr===today?' is-today':'') + (cell.dateStr===state.calendarSelectedDate?' is-selected':'');
    const hasEvent = items.some(i=>i.kind==='event');
    const hasShoot = items.some(i=>i.kind==='shoot');
    const hasPayment = items.some(i=>i.kind==='payment');
    c.innerHTML = `<span class="daynum">${cell.dayNum}</span>
      <div class="dots">
        ${hasEvent?'<span class="cal-dot event"></span>':''}
        ${hasShoot?'<span class="cal-dot shoot"></span>':''}
        ${hasPayment?'<span class="cal-dot payment"></span>':''}
      </div>`;
    c.onclick = ()=>{ state.calendarSelectedDate = cell.dateStr; render(); };
    grid.appendChild(c);
  });
  calPanel.appendChild(grid);
  main.appendChild(calPanel);

  calPanel.querySelector('#calPrevBtn').onclick = ()=>{
    state.calendarViewMonth--; if(state.calendarViewMonth<0){ state.calendarViewMonth=11; state.calendarViewYear--; }
    render();
  };
  calPanel.querySelector('#calNextBtn').onclick = ()=>{
    state.calendarViewMonth++; if(state.calendarViewMonth>11){ state.calendarViewMonth=0; state.calendarViewYear++; }
    render();
  };
  calPanel.querySelector('#calTodayBtn').onclick = ()=>{
    const now = new Date();
    state.calendarViewYear = now.getFullYear(); state.calendarViewMonth = now.getMonth();
    state.calendarSelectedDate = todayKeyStr();
    render();
  };

  const dayPanel = document.createElement('div'); dayPanel.className='panel';
  const selDate = state.calendarSelectedDate || today;
  const selLabel = new Date(selDate+'T00:00:00').toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
  dayPanel.innerHTML = `<div class="profile-head"><div><h2>${selLabel}</h2><div class="sub">${selDate===today?'Today':''}</div></div><button id="addEventBtn">+ Add event</button></div>`;
  const dayEventsWrap = document.createElement('div'); dayEventsWrap.className='day-events';
  dayPanel.appendChild(dayEventsWrap);
  main.appendChild(dayPanel);
  renderDayEvents(dayEventsWrap, selDate);

  dayPanel.querySelector('#addEventBtn').onclick = ()=> openEventForm(selDate, dayPanel, dayEventsWrap);
}

function renderDayEvents(wrap, dateStr){

  };
}


/* ---------- shared helpers ---------- */
function el(tag, cls, text){ const e=document.createElement(tag); e.className=cls; e.textContent=text; return e; }

function showConfirmModal(message){
  return new Promise((resolve)=>{
    const overlay = document.createElement('div'); overlay.className='modal-overlay';
    overlay.innerHTML = `
      <div class="modal-box" style="max-width:360px;">
        <div class="mbody">
          <div style="font-size:14px;line-height:1.5;margin-bottom:16px;">${esc(message)}</div>
          <div class="btn-row" style="padding:0;">
            <button class="danger small" id="confirmYesBtn">Delete</button>
            <button class="ghost small" id="confirmNoBtn">Cancel</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const finish = (result)=>{ overlay.remove(); resolve(result); };
    overlay.querySelector('#confirmYesBtn').onclick = ()=> finish(true);
    overlay.querySelector('#confirmNoBtn').onclick = ()=> finish(false);
    overlay.onclick = (e)=>{ if(e.target===overlay) finish(false); };
  });
}

async function callClaude(systemPrompt, userPrompt, maxTokens){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens: maxTokens||1000, system: systemPrompt, messages:[{role:"user", content:userPrompt}] })
  });
  return await response.json();
}
function parseJsonFromClaude(data){
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock) throw new Error('No text response');
  let clean = textBlock.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  return JSON.parse(clean);
}

(async function init(){
  await loadAll();
  if(state.activeClientId) await loadClientExtras(state.activeClientId);
  render();
})();
